name: Daily Stock Analysis Automation

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch: # 깃허브 웹사이트에서 수동 실행 버튼 허용
    inputs:
      run_mode:
        description: 'Analysis run mode'
        required: false
        default: 'full'
      market_strength_mode:
        description: 'Market strength mode'
        required: false
        default: 'manual'
      requested_at_kst:
        description: 'Requested KST timestamp for manual market strength'
        required: false
        default: ''

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 깃허브에 DB와 엑셀 파일을 다시 저장하기 위해 필요한 권한
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3
        
      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 웹 스냅샷에서 작업용 DB 복원
        run: python -c "from web_database import restore_working_database; restore_working_database()"
          
      - name: 필수 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 메인 자동화 스크립트 실행 (크롤링 -> 분석 -> 엑셀 -> 텔레그램)
        env:
          # GitHub Settings -> Secrets에 설정한 텔레그램 토큰을 가져옵니다.
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          ANALYSIS_RUN_MODE: ${{ github.event_name == 'schedule' && 'bottom_model' || github.event.inputs.run_mode }}
          MARKET_STRENGTH_MODE: ${{ github.event.inputs.market_strength_mode }}
          MARKET_STRENGTH_REQUESTED_AT_KST: ${{ github.event.inputs.requested_at_kst }}
        run: |
          for attempt in 1 2 3; do
            echo "Run attempt ${attempt}/3"
            if python main.py; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "Retrying after 60 seconds..."
            sleep 60
          done

      - name: 웹용 경량 DB 생성
        if: always()
        run: python web_database.py --source stock_data.db --target web_data.db
        
      - name: 누적된 DB 및 엑셀 파일 깃허브 저장소에 커밋 및 푸시
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web_data.db
          if [ -d reports ]; then
            git add -- reports/
          fi
          # 데이터베이스나 엑셀 파일에 변경사항이 있을 때만 커밋 후 푸시합니다.
          if git diff --staged --quiet; then
            echo "No stock data or report changes to commit."
          else
            git commit -m "Auto-update stock data and daily reports [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
